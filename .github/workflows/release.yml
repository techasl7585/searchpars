name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
      - README.md
      - kur.sh
      - install-pardus.sh
      - setup-local-ai.sh
      - uninstall.sh
      - bin/**
      - data/**
      - searchpars/**
      - scripts/build-zip.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Terminal kurulum ZIP'ini üret
        run: |
          chmod +x scripts/build-zip.sh
          ./scripts/build-zip.sh

      - name: Sürümü hazırla
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SearchPars v${{ steps.version.outputs.version }}
          body: |
            Pardus 25 x86_64 için terminalden kurulan SearchPars paketi.

            Kurulum:
            1. `SearchPars_${{ steps.version.outputs.version }}_Pardus.zip` dosyasını indirin.
            2. ZIP'i çıkartın.
            3. Çıkan klasörde terminal açıp `./kur.sh` komutunu çalıştırın.

            Kurucu gerekli Pardus bağımlılıklarını, Ollama'yı ve `qwen3.5:4b`
            modelini terminalde sırayla kurar. Model doğrulanmadan kurulum
            tamamlandı mesajı verilmez.
          files: |
            dist/*.zip
            dist/SHA256SUMS
